<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
    let vetroA  = [];
    let texto = "Números digitados:\n";
    for (let i = 0; i < 10; i++) 
    {
      vetroA [i] = parseInt(prompt("Digite o " + (i + 1) + "º número inteiro:"));
}
  for (let i = 0; i < 10; i++) {
    texto = texto + vetroA [i] + "\n";
}
alert(texto);


   </script> 
</body>
</html>
