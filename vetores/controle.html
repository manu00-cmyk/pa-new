<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let vetroA = [];
        let soma = 0;
        let aprovados = 0;
        let reprovados = 0;
        let textoNotas = "Notas da turma:\n";

for (let i = 0; i < 10; i++) {
    vetroA [i] = parseFloat(prompt("Digite a nota do " + (i + 1) + "º aluno:"));
    soma = soma + vetroA [i];
    
    if (vetroA [i] >= 6) {
        aprovados = aprovados + 1;
    } else {
        reprovados = reprovados + 1;
    }
}

let media = soma / 10;

for (let i = 0; i < 10; i++) {
    textoNotas = textoNotas + "Aluno " + (i + 1) + ": " + vetroA [i] + "\n";
}

alert("Média geral: " + media + "\nAprovados: " + aprovados + "\nReprovados: " + reprovados + "\n\n" + textoNotas);
    </script>
</body>
</html>
