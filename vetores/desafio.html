<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>
let numeros = [];
let aux;

for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite um número:"));
}

for (let i = 0; i < 9; i++) {
    for (let j = 0; j < 9 - i; j++) {
        if (numeros[j] > numeros[j + 1]) {
            aux = numeros[j];
            numeros[j] = numeros[j + 1];
            numeros[j + 1] = aux;
        }
    }
}

document.write("Números em ordem crescente:<br>");

for (let i = 0; i < 10; i++) {
    document.write(numeros[i] + "<br>");
}
</script>

</body>
</html>
