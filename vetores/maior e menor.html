<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let vetorA = [];

for (let i = 0; i < 10; i++) {
    vetorA[i] = parseInt(prompt("Digite o " + (i + 1) + "º número inteiro:"));
}

let maior = vetorA[0];
let menor = vetorA[0];

for (let i = 1; i < 10; i++) {
    if (vetorA[i] > maior) {
        maior = vetorA[i];
    }
    if (vetorA[i] < menor) {
        menor = vetorA[i];
    }
}

alert("Maior número: " + maior + "\nMenor número: " + menor);
    </script>
</body>
</html>
