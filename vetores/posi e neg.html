<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let vetorA = [];
        let positivos = 0;
        let negativos = 0;
        let zeros = 0;

for (let i = 0; i < 10; i++) {
    vetorA[i] = parseInt(prompt("Digite o " + (i + 1) + "º número inteiro:"));
    
    if (vetorA[i] > 0) {
        positivos = positivos + 1;
    } else if (vetorA[i] < 0) {
        negativos = negativos + 1;
    } else {
        zeros = zeros + 1;
    }
}

   alert("Positivos: " + positivos + "\nNegativos: " + negativos + "\nZeros: " + zeros);


    </script>
</body>
</html>
